<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSSA - Cinematic Experience</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            pointer-events: none;
        }
        .message {
            color: white;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            opacity: 0.8;
            padding: 0 20px;
            max-width: 600px;
        }
        .title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <!-- Using the requested cinematic video as a fallback -->
        <video autoplay loop muted playsinline>
            <source src="/media/core-committee-roster-1785120805.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <div id="overlay">
        <div class="title">DSSA</div>
        <div class="message">Enjoy the Cinematic Experience</div>
    </div>
</body>
</html>
